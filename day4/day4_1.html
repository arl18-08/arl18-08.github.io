<html lang = "en">

<head>
    <title>table ex. day 4</title>
</head>

<body>

        <!--header cells are automatically bold-->

            <tr>
                <th>cell I</th>
                <th>cell II</th>
                <th>cell III</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>data i</td>
                <td>data ii</td>
                <td> data iii</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan = "3">foot i</td>
            </tr>
        </tfoot>
    </table>
</body>


</html>
