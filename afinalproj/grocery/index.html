<!DOCTYPE html>>
<html>
    <header>
        <title>Make a Grocery List</title>
        <link rel="stylesheet" href="grocery/style.css">
    </header>

    <body>
        <header> <h1>Make a Grocery List</h1> </header>
        <h3>Add Items to your List!</h3>
        <main>
            <section aria-labelledby="checklist-heading">
                <h2 id="checklist-heading">Add an Item</h2>
                
                <form id="checklist-form">
                 <label for="item-input">Item</label>
                 <input
                      type="text"
                      id="item-input"
                      name="item"
                      placeholder="Enter an item"
                      autocomplete="off"
                     required
                 >
                 <button type="submit">Add to List</button>
             </form>

             <ul id="checklist">
            <!-- add items here -->
             </ul>
         </section>

        </main>


        <script src="grocery/script.js"></script>
    </body>
   
</html>
